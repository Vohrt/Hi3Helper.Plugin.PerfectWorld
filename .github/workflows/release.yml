name: Release Plugin

# Builds the selected game plugin(s), runs the Indexer to produce the Collapse
# release bundle (per-file Brotli `.br` entries + manifest.json, packed into
# `<GAME>_<version>_API-<standard>_<yyyyMMdd>.zip`), publishes that zip plus the
# raw manifest.json + <GAME>.dll onto a GitHub Release, and pushes the auto-update
# files (manifest.json + every asset it references) into the per-plugin `<GAME>/`
# folder on the `release` branch that the in-launcher self-updater reads from.
#
# The `game` input selects which plugin(s) to release: a single game, or `all`
# to build and publish every supported game in one run. Trigger it manually
# from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Which game plugin(s) to release'
        required: true
        type: choice
        options:
          - all
          - NTE
          - P5X
        default: all
      version:
        description: 'Plugin version (e.g. 1.0.0)'
        required: true
        type: string
      publish_profile:
        description: 'Publish profile to use'
        required: true
        type: choice
        options:
          - ReleasePublish-O2
          - ReleasePublish-O1
          - ReleaseNoReflectionPublish-O2
          - ReleaseNoReflectionPublish-O1
          - DebugPublish
          - DebugNoReflectionPublish
        default: ReleasePublish-O2
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        type: boolean
        default: false

# Serialize runs so parallel invocations never race on the shared `release` branch.
concurrency:
  group: release-cdn-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Expand the `game` input into a build matrix: one entry per selected game.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve game matrix
        id: matrix
        shell: bash
        run: |
          case "${{ github.event.inputs.game }}" in
            all) echo 'matrix={"game":["NTE","P5X"]}' >> "$GITHUB_OUTPUT" ;;
            NTE) echo 'matrix={"game":["NTE"]}' >> "$GITHUB_OUTPUT" ;;
            P5X) echo 'matrix={"game":["P5X"]}' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown game '${{ github.event.inputs.game }}'"; exit 1 ;;
          esac

  release:
    needs: setup
    runs-on: windows-latest
    # max-parallel: 1 keeps the per-game legs sequential so each one clones the
    # `release` branch after the previous leg has pushed its folder — no push race.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.ref }}

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The NoReflection publish profiles must be paired with their matching
      # build configuration (they define USELIGHTWEIGHTJSONPARSER). This mirrors
      # the mapping in CompileAOTAndShip.bat.
      - name: Resolve build configuration from publish profile
        id: cfg
        shell: pwsh
        run: |
          $publishProfile = "${{ github.event.inputs.publish_profile }}"
          $cfg = switch -Wildcard ($publishProfile) {
            'DebugNoReflection*'   { 'DebugNoReflection' }
            'ReleaseNoReflection*' { 'ReleaseNoReflection' }
            'Debug*'               { 'Debug' }
            default                { 'Release' }
          }
          # Mirror CompileAOTAndShip.bat's _isRemoveSymbol: strip debug symbols for
          # every profile except the Debug ones. Stripping keeps the auto-update
          # bundle small - the NativeAOT PDB alone is ~34 MB per game.
          $removeSymbols = if ($publishProfile -like 'Debug*') { 'false' } else { 'true' }
          "configuration=$cfg"            >> $env:GITHUB_OUTPUT
          "remove_symbols=$removeSymbols" >> $env:GITHUB_OUTPUT
          Write-Host "publish_profile=$publishProfile -> configuration=$cfg, remove_symbols=$removeSymbols"

      - name: Restore
        run: dotnet restore Hi3Helper.Plugin.PerfectWorld.slnx --runtime win-x64

      - name: Publish (NativeAOT)
        # No --no-restore here: dotnet publish must re-run restore with the
        # publish profile in context so the NativeAOT ILCompiler is pulled in.
        # Without it the publish silently falls back to a plain self-contained
        # build and the Indexer rejects the (non-native) plugin DLL.
        run: >
          dotnet publish Hi3Helper.Plugin.${{ matrix.game }}/Hi3Helper.Plugin.${{ matrix.game }}.csproj
          --configuration ${{ steps.cfg.outputs.configuration }}
          --runtime win-x64
          /p:PublishProfile=${{ github.event.inputs.publish_profile }}
          /p:Version=${{ github.event.inputs.version }}
          -o ./publish_output

      # Mirror CompileAOTAndShip.bat's :RemovePDBIfNotDebug step: drop the PDBs from
      # the publish output before indexing so they never enter manifest.json, the
      # release zip, or the auto-update CDN branch. The launcher's self-updater would
      # otherwise have to download the ~34 MB NativeAOT PDB on every update. Skipped
      # for Debug profiles so debug builds keep their symbols.
      - name: Strip debug symbols (non-Debug profiles)
        if: steps.cfg.outputs.remove_symbols == 'true'
        shell: pwsh
        run: |
          $pdbs = @(Get-ChildItem ./publish_output -Recurse -File -Filter *.pdb)
          if ($pdbs.Count -eq 0) {
            Write-Host "No PDB files found in publish output."
          }
          else {
            foreach ($pdb in $pdbs) {
              Write-Host "Removing $($pdb.FullName)"
              Remove-Item -LiteralPath $pdb.FullName -Force
            }
            Write-Host "Removed $($pdbs.Count) PDB file(s) before indexing."
          }

      # Indexer.exe (committed at the repo root) reads the published plugin,
      # writes manifest.json, Brotli-compresses every asset and packs the
      # release zip inside ./publish_output.
      - name: Run Indexer (manifest + .br + release zip)
        run: .\Indexer.exe .\publish_output

      - name: List produced artifacts
        shell: pwsh
        run: Get-ChildItem ./publish_output -Recurse -File | Select-Object Length, FullName | Format-Table -AutoSize

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.game }}@v${{ github.event.inputs.version }}
          name: ${{ matrix.game }} v${{ github.event.inputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            ./publish_output/*.zip
            ./publish_output/manifest.json
            ./publish_output/${{ matrix.game }}.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stage manifest.json plus EVERY asset the manifest references, mirroring
      # publish_output's directory layout under ./cdn-stage. The launcher's managed
      # self-updater downloads *all* assets listed in manifest.json, so the CDN
      # branch must host every one of them. If any asset is missing (404), the whole
      # update aborts and the plugin can never move past its current version, which
      # shows up as an endless "update available -> restart -> still outdated" loop.
      - name: Stage auto-update CDN files (manifest + all referenced assets)
        shell: pwsh
        run: |
          $src   = "publish_output"
          $stage = "cdn-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $manifestPath = Join-Path $src "manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            Write-Error "manifest.json not found in $src"; exit 1
          }
          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $stage "manifest.json") -Force

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          foreach ($asset in $manifest.Assets) {
            $rel  = $asset.FilePath
            $from = Join-Path $src   $rel
            $to   = Join-Path $stage $rel
            if (-not (Test-Path -LiteralPath $from)) {
              Write-Error "Manifest asset missing from publish output: $rel"; exit 1
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Path $to -Parent) | Out-Null
            Copy-Item -LiteralPath $from -Destination $to -Force
          }
          Write-Host "Staged manifest.json + $($manifest.Assets.Count) assets into $stage"

      # The in-launcher self-updater (SelfUpdate.cs) reads manifest.json and all the
      # assets it lists from the per-plugin folder on the `release` branch, served via
      # raw.githubusercontent.com. Publish the complete staged set there so the managed
      # update can download every asset. Uses the built-in GITHUB_TOKEN (same-repo
      # push) — no extra secret required.
      - name: Publish auto-update files to the release CDN branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ matrix.game }}
          CDN_BRANCH: release
        run: |
          set -euo pipefail

          STAGE="cdn-stage"
          WORKDIR="cdn-branch"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ ! -f "${STAGE}/manifest.json" ]; then
            echo "::error::${STAGE}/manifest.json not found (the staging step must run first)"
            exit 1
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the CDN branch if it already exists, otherwise start a fresh orphan branch.
          if git ls-remote --exit-code --heads "${REMOTE}" "${CDN_BRANCH}" >/dev/null 2>&1; then
            git clone --branch "${CDN_BRANCH}" --single-branch --depth 1 "${REMOTE}" "${WORKDIR}"
          else
            git clone --depth 1 "${REMOTE}" "${WORKDIR}"
            git -C "${WORKDIR}" checkout --orphan "${CDN_BRANCH}"
            git -C "${WORKDIR}" rm -rf . >/dev/null 2>&1 || true
          fi

          # Keep every published file byte-exact; the updater verifies each asset's MD5 hash.
          git -C "${WORKDIR}" config core.autocrlf false
          printf '* -text\n' > "${WORKDIR}/.gitattributes"

          # Replace the game's folder wholesale so assets removed between versions don't
          # linger on the CDN and drift out of sync with the manifest.
          rm -rf "${WORKDIR:?}/${SHORT}"
          mkdir -p "${WORKDIR}/${SHORT}"
          cp -R "${STAGE}/." "${WORKDIR}/${SHORT}/"

          git -C "${WORKDIR}" add -A
          if git -C "${WORKDIR}" diff --cached --quiet; then
            echo "No auto-update changes to publish."
            exit 0
          fi

          git -C "${WORKDIR}" commit -m "Publish ${SHORT} v${{ github.event.inputs.version }} auto-update files"
          git -C "${WORKDIR}" push "${REMOTE}" "HEAD:${CDN_BRANCH}"
